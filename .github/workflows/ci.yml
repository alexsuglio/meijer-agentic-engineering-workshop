name: FreshCart baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pnpm when selected
        if: matrix.manager == 'pnpm'
        run: npm install --global pnpm@10
      - name: Install with npm
        if: matrix.manager == 'npm'
        run: npm ci
      - name: Install with pnpm
        if: matrix.manager == 'pnpm'
        run: pnpm install --frozen-lockfile
      - name: Preflight and baseline verification
        run: |
          ${{ matrix.manager }} run setup:check
          ${{ matrix.manager }} run verify
      - name: Starter solution matrix on explicit manual release check
        if: github.event_name == 'workflow_dispatch' && matrix.manager == 'npm'
        run: npm run validate:matrix
